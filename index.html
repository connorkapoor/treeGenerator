<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal-Driven Tree Supports</title>
    <style>
        :root {
            color-scheme: dark;
            --accent: #6bd86b;
            --bg: #0f1118;
            --panel: rgba(18, 20, 30, 0.88);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f2f5ff;
            --muted: #9da4c2;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .hud {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .title-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            max-width: 620px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            pointer-events: auto;
        }
        .title-card h1 {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        .title-card p {
            margin: 4px 0;
            font-size: 13px;
            color: var(--muted);
        }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            pointer-events: auto;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        button:active {
            transform: translateY(1px);
        }
        button.primary {
            background: rgba(107, 216, 107, 0.2);
            border-color: rgba(107, 216, 107, 0.4);
        }
        button.primary:hover {
            background: rgba(107, 216, 107, 0.3);
        }
        button.danger {
            border-color: rgba(255, 99, 99, 0.35);
            color: #ff9a9a;
        }
        button.danger:hover {
            background: rgba(255, 99, 99, 0.15);
        }
        button.toggle.active {
            background: rgba(107, 216, 107, 0.25);
            border-color: rgba(107, 216, 107, 0.6);
            color: var(--text);
        }
        .status {
            font-size: 12px;
            letter-spacing: 0.02em;
            color: var(--muted);
        }
        .sidebar {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 240px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            pointer-events: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .sidebar h2 {
            margin: 0 0 10px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .target-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
        }
        .target-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .target-item button {
            align-self: flex-start;
            padding: 6px 10px;
            font-size: 11px;
        }
        @media (max-width: 960px) {
            .sidebar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="hud">
        <div class="title-card">
            <h1>Goal-Driven Tree Supports</h1>
            <p>1. Import a part (STL) — it is fit into a 250 mm build envelope.</p>
            <p>2. Enable “Pick targets” and click the part to place support tips.</p>
            <p>3. Grow tree supports from the build plate to the selected targets.</p>
            <div class="controls">
                <button id="importBtn">Import STL</button>
                <button id="targetBtn" class="toggle">Pick targets</button>
                <button id="clearTargetsBtn" class="danger">Clear targets</button>
                <button id="generateBtn" class="primary">Grow supports</button>
                <button id="clearSupportsBtn">Clear supports</button>
            </div>
            <div id="status" class="status">Load a part to get started.</div>
        </div>
    </div>
    <div class="sidebar">
        <h2>Targets</h2>
        <ul id="targetList" class="target-list"></ul>
    </div>
    <input id="fileInput" type="file" accept=".stl" hidden>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/loaders/STLLoader.js"></script>
    <script src="script.js"></script>
</body>
</html>
